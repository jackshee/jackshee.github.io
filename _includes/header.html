<header class="site-header {% if page.hero and site.header.transparent %}transparent{% endif %} {% if site.header.sticky %}sticky{% endif %}">
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                {% if site.logo %}
                <a href="{{ '/' | relative_url }}" class="logo">
                    <img src="{{ site.logo | relative_url }}" alt="{{ site.logo_text | default: site.title }}">
                </a>
                {% else %}
                <a href="{{ '/' | relative_url }}" class="logo-text">{{ site.logo_text | default: site.title }}</a>
                {% endif %}
            </div>
            
            <div class="navbar-right">
                <div class="navbar-menu">
                    <ul class="navbar-nav">
                        {% for item in site.navigation %}
                        <li class="nav-item">
                            <a href="{{ item.url | relative_url }}" class="nav-link {% if page.url == item.url %}active{% endif %}">
                                {{ item.name }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
                
                {% if site.dark_mode.enabled %}
                <button class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-toggle-circle"></span>
                    <svg class="theme-toggle-icon theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="theme-toggle-icon theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                {% endif %}
                
                <button class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>
    
    <div class="mobile-overlay"></div>
</header>
