# Site Settings
title: "Jack Shee - Portfolio"
description: "A minimal resume and portfolio website showcasing my work and experience"
url: "https://jackshee.github.io"
baseurl: ""

# Author
author:
  name: "Jack Shee"
  email: "jackshee97@gmail.com"
  bio: "Full-stack developer passionate about creating beautiful and functional web experiences"
  avatar: "/assets/images/avatar.jpg"

# Logo
logo: "/assets/images/logo.png"
logo_text: "Jack Shee"

# Colors
colors:
  primary: "#3b82f6"
  secondary: "#8b5cf6"
  accent: "#10b981"
  text: "#1f2937"
  text_light: "#6b7280"
  background: "#ffffff"
  background_dark: "#111827"

# Typography
fonts:
  primary: "Fira Code"
  secondary: "Fira Code"
  google_fonts: "Fira+Code:wght@300;400;500;600;700"

# Dark Mode
dark_mode:
  enabled: true
  default: "auto" # auto, light, dark

# Header
header:
  transparent: true
  sticky: true
  animated: true

# Navigation
navigation:
  - name: "About"
    url: "/about"
  - name: "Projects"
    url: "/projects"
  - name: "Blog"
    url: "/blog"

# Social Links
social:
  github: "https://github.com/jackshee"
  linkedin: "https://linkedin.com/in/jackshee/"
  twitter: "https://x.com/jshee_f"

# Footer
footer:
  copyright: "© 2026 Jack Shee. All rights reserved."
  menus:
    - title: "Quick Links"
      links:
        - name: "Home"
          url: "/"
        - name: "About"
          url: "/about"
        - name: "Contact"
          url: "/contact"
    - title: "Resources"
      links:
        - name: "Blog"
          url: "/blog"
        - name: "Projects"
          url: "/projects"
        - name: "Services"
          url: "/services"

# Blog
blog:
  paginate: 5
  paginate_path: "/blog/page:num/"

# SEO
seo:
  default_image: "/assets/images/og-image.jpg"
  twitter_handle: "@jshee_f"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
sass:
  style: compressed

